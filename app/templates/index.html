<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniGPT-Chinese · 中文续写</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #fdf2f8 0%, #fce7f3 50%, #fbcfe8 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        /* 响应式：手机自适应 */
        .container {
            width: 90%;
            max-width: 620px;
            margin: 20px auto;
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
        }
        h1 { font-size: 26px; color: #1f2937; text-align: center; margin-bottom: 8px; }
        .subtitle { text-align: center; color: #9ca3af; font-size: 14px; margin-bottom: 24px; }

        textarea {
            width: 100%;
            height: 100px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            padding: 14px;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.3s;
            background: #fafafa;
        }
        textarea:focus { outline: none; border-color: #ec4899; background: #fff; }

        .controls { display: flex; align-items: center; gap: 12px; margin: 16px 0; }
        .temp-label { font-size: 13px; color: #6b7280; white-space: nowrap; }
        input[type="range"] { flex: 1; accent-color: #ec4899; }
        .temp-value { font-size: 13px; color: #ec4899; font-weight: bold; width: 32px; text-align: center; }

        button {
            width: 100%;
            padding: 14px;
            font-size: 17px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            background: linear-gradient(135deg, #ec4899, #f472b6);
            color: white;
            transition: opacity 0.2s, transform 0.1s;
        }
        button:hover { opacity: 0.9; }
        button:active { transform: scale(0.98); }
        /* 禁用态（防连点） */
        button:disabled { opacity: 0.6; cursor: not-allowed; pointer-events: none; }

        /* 输出框：限制高度 + 滚动 + 保留换行 */
        .result-box {
            margin-top: 24px;
            padding: 20px;
            background: #fdf2f8;
            border-radius: 12px;
            border-left: 4px solid #ec4899;
            min-height: 80px;
            max-height: 320px;
            overflow-y: auto;
            line-height: 1.9;
            color: #374151;
            font-size: 15px;
            white-space: pre-wrap;   /* 保留换行/缩进 */
            word-wrap: break-word;
        }
        .result-meta { margin-top: 8px; font-size: 12px; color: #9ca3af; text-align: right; }
        .loading { color: #ec4899; }
        .loading::after {
            content: '…';
            animation: dots 1.2s infinite;
        }
        @keyframes dots { 0%,20% {content:'';} 40% {content:'.';} 60% {content:'..';} 100% {content:'...';} }

        .error { color: #dc2626; }
        .result-actions { margin-top: 12px; display: flex; gap: 10px; }
        .result-actions button { width: auto; padding: 8px 16px; font-size: 13px; background: #f3f4f6; color: #374151; border: 1px solid #e5e7eb; }
        .result-actions button:hover { background: #e5e7eb; }
        footer { text-align: center; margin-top: 24px; font-size: 12px; color: #d1d5db; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌸 MiniGPT-Chinese</h1>
        <p class="subtitle">从零训练的中文续写模型 · 百合轻小说语料</p>

        <textarea id="prompt" placeholder="输入开头，例如：我真的..."></textarea>

        <div class="controls">
            <span class="temp-label">温度</span>
            <input type="range" id="temp" min="0.5" max="1.5" step="0.1" value="1.0" oninput="updateTemp()">
            <span class="temp-value" id="tempVal">1.0</span>
        </div>

        <button id="genBtn" onclick="generate()">✨ 开始续写</button>

        <div class="result-box" id="result">等待生成...</div>
        <div class="result-meta" id="meta"></div>

        <div class="result-actions" id="actions" style="display:none;">
            <button onclick="copyResult()">📋 复制</button>
            <button onclick="clearResult()">🗑️ 清空</button>
        </div>

        <footer>MiniGPT-Chinese · 从零实现的 Transformer</footer>
    </div>

    <script>
        function updateTemp() {
            document.getElementById('tempVal').textContent = document.getElementById('temp').value;
        }

        async function generate() {
            const prompt = document.getElementById('prompt').value.trim();
            // 空输入拦截
            if (!prompt) { alert('请先输入开头文字'); return; }

            const temp = parseFloat(document.getElementById('temp').value);
            const result = document.getElementById('result');
            const meta = document.getElementById('meta');
            const btn = document.getElementById('genBtn');
            const actions = document.getElementById('actions');

            // 防连点：禁用按钮 + 状态切换
            btn.disabled = true;
            btn.textContent = '⏳ 生成中...';
            result.className = 'result-box loading';
            result.textContent = '模型正在思考';
            meta.textContent = '';
            actions.style.display = 'none';

            const startTime = Date.now();
            try {
                const response = await fetch('/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt, max_tokens: 80, temperature: temp })
                });
                const data = await response.json();
                result.className = 'result-box';
                result.textContent = data.text;
                const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
                meta.textContent = `耗时 ${elapsed}s · ${data.text.length} 字`;
                actions.style.display = 'flex';
            } catch (e) {
                result.className = 'result-box error';
                result.textContent = '❌ 生成失败，请重试';
            } finally {
                btn.disabled = false;
                btn.textContent = '✨ 开始续写';
            }
        }

        async function copyResult() {
            const text = document.getElementById('result').textContent;
            await navigator.clipboard.writeText(text);
            alert('已复制');
        }

        function clearResult() {
            document.getElementById('result').textContent = '等待生成...';
            document.getElementById('result').className = 'result-box';
            document.getElementById('meta').textContent = '';
            document.getElementById('actions').style.display = 'none';
        }
    </script>
</body>
</html>
